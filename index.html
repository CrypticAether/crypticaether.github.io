<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" type="image/x-icon" href="/images/icon.jpg">
    <title>BADASS FISHING</title>
	<meta property="og:title" content="Title">

	body{

}

  <body>
      <h1 class="title">Basterd</h1>

      <canvas id="tehCanvas" width="800" height="800"></canvas>

      <script>
	  var canv = tehCanvas
var canvContext = canv.getContext("2d")

//

var imageData = canvContext.createImageData(canv.width, canv.height)

//

var lastReport = new Date().getMilliseconds()
var frameCount = 0

//

var v3 = newVector3
var v2 = newVector2

var corners = [
  v3(-1, -1, 1),
  v3(-1, 1, 1),
  v3(1, -1, 1),
  v3(1, 1, 1),

  v3(-1, -1, -1),
  v3(-1, 1, -1),
  v3(1, -1, -1),
  v3(1, 1, -1)
]

//

function writePixel(x, y, r, g, b, a = 255) {
    var yIdx = Math.floor(y - 1) * imageData.width
    var xIdx = (x - 1) % imageData.width
    var index = (yIdx + xIdx) * 4

    imageData.data[index] = r
    imageData.data[index + 1] = g
    imageData.data[index + 2] = b
    imageData.data[index + 3] = a
}

function randI(min, max) {
  return Math.floor(Math.random() * (max - min) + min + 0.5)
}

function newVector3(x = 0, y = 0, z = 0) {
  return {x: x, y: y, z: z}
}

function newVector2(x = 0, y = 0) {
  return {x: x, y: y}
}

function rotate3D(point, rot) {  // rotation order ZYX

  // Z ROT:

  var theta = rot.z
  var startX = point.x

  point.x = point.x * Math.cos(theta) - point.y * Math.sin(theta)
  point.y = startX * Math.sin(theta) + point.y * Math.cos(theta)


  // Y ROT: 

  var theta = rot.y
  var startX = point.x

  point.x = point.x * Math.cos(theta) + point.z * Math.sin(theta)
  point.z = -startX * Math.sin(theta) + point.z * Math.cos(theta)


  // X ROT:

  var theta = rot.x
  var startY = point.y

  point.y = point.y * Math.cos(theta) - point.z * Math.sin(theta)
  point.z = startY * Math.sin(theta) + point.z * Math.cos(theta)

  return point
}

function connectPoints(pointA, pointB) {
  canvContext.lineWidth = cornerVisualSize
  canvContext.beginPath()

  var rotatedA = rotate3D(v3(pointA.x, pointA.y, pointA.z), currentRotation)
  var rotatedB = rotate3D(v3(pointB.x, pointB.y, pointB.z), currentRotation)

  var projectedAX = centerPoint.x + rotatedA.x * cubeScale - cornerVisualSize / 2 + cornerVisualSize / 2
  var projectedAY = centerPoint.y + rotatedA.y * cubeScale - cornerVisualSize / 2 + cornerVisualSize / 2

  var projectedBX = centerPoint.x + rotatedB.x * cubeScale - cornerVisualSize / 2 + cornerVisualSize / 2
  var projectedBY = centerPoint.y + rotatedB.y * cubeScale - cornerVisualSize / 2 + cornerVisualSize / 2

  canvContext.moveTo(projectedAX, projectedAY)
  canvContext.lineTo(projectedBX, projectedBY)
  canvContext.stroke()
}

//canvContext.putImageData(imageData, 10, 10)

var centerPoint = v2(canv.width / 2, canv.height / 2)
var cubeScale = 100
var cornerVisualSize = 5

var currentRotation = v3()

var rotSpeed = 5

var lastFrame = Date.now()

setInterval(function() {
  var delta = (Date.now() - lastFrame) / 1000

  lastFrame = Date.now()

  canvContext.clearRect(0, 0, canv.width, canv.height)

  connectPoints(corners[0], corners[1])
  connectPoints(corners[2], corners[3])
  connectPoints(corners[4], corners[5])
  connectPoints(corners[6], corners[7])
  connectPoints(corners[0], corners[4])
  connectPoints(corners[0], corners[2])
  connectPoints(corners[1], corners[3])
  connectPoints(corners[1], corners[5])
  connectPoints(corners[2], corners[6])
  connectPoints(corners[2], corners[0])
  connectPoints(corners[3], corners[7])
  connectPoints(corners[4], corners[6])
  connectPoints(corners[5], corners[7])

  for (var i in corners) {
    var corner = corners[i]

    var rotated = rotate3D(v3(corner.x, corner.y, corner.z), currentRotation)

    var projectedX = rotated.x * cubeScale
    var projectedY = rotated.y * cubeScale

    canvContext.fillRect(centerPoint.x + projectedX - cornerVisualSize / 2, centerPoint.y + projectedY - cornerVisualSize / 2, cornerVisualSize, cornerVisualSize)

  }

  if ((Math.abs(dragVelocity.x) > .01 || Math.abs(dragVelocity.y) > .01) && !dragging) {
    console.log(dragVelocity)
    dragVelocity.x *= (1-delta)
    dragVelocity.y *= (1-delta)
    currentRotation.x += dragVelocity.x * dragSpeed
    currentRotation.y += dragVelocity.y * dragSpeed
  } else  if (!dragging && Date.now() - dragStop > 1000) {
    var rot = delta / 3.141592653 * rotSpeed
  
    currentRotation.y += rot
    currentRotation.x += rot/2
  }
  
}, 0)

var cursorPos = v2()
var dragging = false
var dragStop = 0
var dragSpeed = 1/50
var dragVelocity = v2()

document.onmousemove = function(event) {
  if (dragging) {
    var delta = v2(event.pageX - cursorPos.x, event.pageY - cursorPos.y)

    currentRotation.x += delta.y * dragSpeed
    currentRotation.y += delta.x * dragSpeed

    dragVelocity.x = delta.y
    dragVelocity.y = delta.x

    console.log(dragVelocity, delta)
  }

  cursorPos.x = event.pageX
  cursorPos.y = event.pageY
}

addEventListener("mousedown", (event) => {
  lastMoveTick = Date.now()
  dragging = true
})

addEventListener("mouseup", (event) => {
  if (dragging) {
    dragStop = Date.now()
  }
  dragging = false
})

canv.addEventListener("mouseleave", (event) => {
  if (dragging) {
    dragStop = Date.now()
  }
  dragging = false
  
  
})
	  
	  </script>
  </body>
</html>
